# Local development only. All published ports are bound to loopback.
x-local-defaults: &local-defaults
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  bun:
    <<: *local-defaults
    image: oven/bun:1.4.2
    working_dir: /app
    init: true
    mem_limit: 1g
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: development
      PORT: "3030"
      APP_URL: http://localhost:${PORT:-3030}
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/database
      MAIL_SERVER: mailpit
      MAIL_PORT: "1025"
      MAIL_SECURE: "false"
      MAIL_USERNAME: ""
      MAIL_PASSWORD: ""
      MAIL_FROM_EMAIL: no-reply@bunsai.local
      MAIL_FROM_NAME: Bunsai
      # No reverse proxy in this stack: ignore forwarded client-IP headers.
      TRUSTED_PROXY_IPS: ""
      ASSETS_DIR: /app/data/assets
      ASSET_CACHE_DIR: /app/data/assets-cache
      # Select s3 in .env to store new assets in MinIO; existing rows keep their backend.
      ASSET_STORAGE: ${ASSET_STORAGE:-local}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-bunsai}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-bunsai}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-bunsai-local-password}
      S3_SESSION_TOKEN: ""
      S3_VIRTUAL_HOSTED_STYLE: "false"
    command:
      - /bin/sh
      - -ec
      - bun install --frozen-lockfile && bun run migrate && exec bun run dev
    ports:
      - "127.0.0.1:${PORT:-3030}:3030"
    volumes:
      - .:/app:ro
      - bun_node_modules:/app/node_modules
      - bun_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      minio:
        condition: service_healthy

  postgres:
    <<: *local-defaults
    image: postgres:17-alpine
    mem_limit: 512m
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: database
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d database"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    <<: *local-defaults
    image: axllent/mailpit:v1.31.4
    mem_limit: 256m
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "500"
      MP_MAX_MESSAGE_SIZE: "10"
      MP_DISABLE_VERSION_CHECK: "true"
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
    volumes:
      - mailpit_data:/data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    <<: *local-defaults
    image: bunsai-minio:2025-10-15
    build:
      context: ./docker/minio
    mem_limit: 1g
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-bunsai}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-bunsai-local-password}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  bun_node_modules:
  bun_data:
  postgres_data:
  mailpit_data:
  minio_data:
